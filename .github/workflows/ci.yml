name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies and application
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test booking rules, concurrency, and coverage
        run: pytest --cov=clinic_api --cov-report=term-missing --cov-fail-under=90

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build -t clinic-booking-api .
      - name: Check container readiness and non-root execution
        run: |
          docker run --detach --name clinic-booking-smoke --publish 127.0.0.1:8000:8000 clinic-booking-api
          curl --retry 15 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:8000/health
          test "$(docker exec clinic-booking-smoke id -u)" = "10001"
      - name: Clean up smoke container
        if: always()
        run: docker rm --force clinic-booking-smoke || true
